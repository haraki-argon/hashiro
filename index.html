<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<title>Hashiro</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<link rel="stylesheet" href="css/index.css" />
</head>

<body>
	<div class="mask" style="display: none;" aria-hidden="true">
		<h1 class="title">お名前<span>を...</span></h1>
		<input type="text" class="input" placeholder="ここで入力！" />
		<button class="submit">決定</button>
		<div class="query">
			<p>QUERY</p>
		</div>
	</div>

	<div class="panel">
		<div class="tachie">
			<img src="img/normal.png" alt="" />
		</div>
		<div class="left">
			<p>HASHIRO</p>
		</div>
		<div class="right"></div>
		<p class="name">椎 <span>羽白</span></p>
		<div class="status">

			<div class="heart">
				<span class="bar"><span class="ins"></span></span>
				<span class="icon">♥</span>
			</div>
			<div class="power">
				<span class="bar"><span class="ins"></span></span>
				<span class="icon">★</span>
			</div>

		</div>
		<p class="dialog">
			何も言えない状況になってしまった。想定外の事態に、俺はただ立ち尽くすしかなかった。
		</p>
		<span class="dialog_next">
			▼
		</span>
		<div class="pulse">
			<p>PULSE</p>
		</div>
		<div class="bottom">
			<p>ALTER EGO <span>2026/9/5 16:56</span></p>
		</div>
	</div>

</body>
<script type="text/javascript">
	window.onload = function () {
		document.addEventListener('touchstart', function (event) {
			if (event.touches.length > 1) {
				event.preventDefault();
			}
		});
		var lastTouchEnd = 0;
		document.addEventListener('touchend', function (event) {
			var now = (new Date()).getTime();
			if (now - lastTouchEnd <= 300) {
				event.preventDefault();
			}
			lastTouchEnd = now;
		}, false);
		document.addEventListener('gesturestart', function (event) {
			event.preventDefault();
		});
	}
</script>
<script src="js/content.js"></script>
<script src="js/dialog.js"></script>
<script src="js/live.js"></script>
<script src="js/enter.js"></script>

</html>
